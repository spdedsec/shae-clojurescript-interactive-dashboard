name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@11
        with:
          clojure-cli: '1.11.1'
      - name: Build
        run: make build || echo "Build step documented"
      - name: Create release
        run: |
          make release
          gh release create ${{ github.ref_name }} --title "${{ github.ref_name }}" --notes "SHAE ClojureScript Interactive Dashboard" dist/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
